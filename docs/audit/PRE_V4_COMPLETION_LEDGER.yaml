    finding: "No test pinned two of the resting limit order's fill rules: a buy limit resting against a bar that opens above it fills at its limit (or at an open below it), and a resting sell limit fills only once the bid reaches it. Mutating either -- a buy limit filling at the open above it, a sell limit crossing on a lower bid -- passed the whole suite in the v3.11 defect-injection run (W08, W09)."
