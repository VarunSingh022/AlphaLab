  - id: "NUM-012"
    category: "numerical"
    subsystem: "runtime"
    module: "alphalab/runtime/{execution_pipeline,run,live}.py"
    finding: "The run drivers were not pinned to ACCOUNTING_CONTEXT, only the engines: ExecutionPipeline negated a sale's quantity in the caller's context (unary minus rounds a Decimal), exposure sums ran there too, and LiveSession raised InvalidOperation from the venue mirror under a low precision."
    evidence: "Probe: under decimal precision 5 a sale of 185.295944 booked 185.30. The v3.10 oracle missed it: its figures had at most 8 significant digits and its lowest precision was 9."
    severity: "high"
    current_state: "Shipped in v3.10.0 and earlier (ACC-004 was incomplete)."
    required_change: "Pin every public entry point of ExecutionPipeline, RunEngine and LiveSession, strategies dispatched from them included; hold the set with a structural test and a long-digit oracle at several precisions."
    rationale: "A run must be a function of its inputs, not of the ambient decimal context of the caller's thread."
    release: "v3.11.0"
    implementation_status: "implemented (v3.11.0)"
    test_status: "tests/regression/test_ambient_decimal_context.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.11.0; ADR-0046"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
