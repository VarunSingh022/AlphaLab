    evidence: "v3.11 benchmark gate; ten reruns side by side."
    severity: "low"
    current_state: "Shipped since v3.3."
    required_change: "Judge the ceilings by the suite's stabilized method; keep the throughput lines as one run with the collector on."
    rationale: "A guard that fails on a collection landing in one sample reports the machine, not the algorithm."
    release: "v3.11.0"
    implementation_status: "implemented (v3.11.0)"
    test_status: "benchmark_institutional passes 5 of 5 reruns; scenario 4.37x-4.78x"
    benchmark_status: "benchmarks/benchmark_institutional.py"
