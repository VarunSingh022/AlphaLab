    required_change: "v3.10: correct the contract (documented delta semantics, explicit IntentKind.DELTA). v3.11: add position-aware TARGET_QUANTITY and TARGET_WEIGHT intents computed against current positions and working orders."
    rationale: "Strategy authors following the docstring produce accumulating positions."
