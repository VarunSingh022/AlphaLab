  - id: "PRF-013"
    category: "performance"
    subsystem: "portfolio_optimizer"
    module: "alphalab/analytics/risk_model.py (FactorStructure, CovarianceMatrix, euler_decomposition, factor_risk); alphalab/portfolio_optimizer/construction.py (ConstructionProblem, construct)"
    finding: "v3.12 (PRF-005) solved construction over a factor model in O(n k^2) per step and published 10,000 assets in 1.6 s -- the solver's time, measured through its internal entry point. Through the public API the covariance had to be a CovarianceMatrix, which factor_model writes out and renders value by value: O(n^2) in time and memory, 29 s and 1.3 GB at 4,000 assets (traced at the build's peak, on the release tree), about six times that at 10,000, before the first step; and construct's diagnostics decomposed risk over the dense matrix, O(n^2) again (2.1 s of 2.8 s at 2,000 assets, profiled)."
    evidence: "v3.13 stress run (docs/audit/scripts/stress_v3_13.py factor); cProfile of factor_model at 1,000 assets and of construct at 2,000."
    severity: "medium"
    current_state: "Shipped in 3.12.0: the structured solver reachable from the public path only after an O(n^2) dense build."
    required_change: "REPLACE WITH BETTER DESIGN: the FactorStructure is a covariance in its own right. FactorStructure.of builds it in O(n k^2), and it holds nothing O(n^2); ConstructionProblem.covariance, euler_decomposition and factor_risk take it, the last two decomposing through its factors; the dense values are written out only for a method that reads them (risk parity, a universe under FACTOR_STRUCTURED_MINIMUM_ASSETS, a structure that cannot establish definiteness, a program the structured method does not certify), once per construction. A structure has its own identity; matrix() writes it out as exactly what factor_model builds; a problem over a matrix keeps its 3.12 identity and result."
    rationale: "A capability published at a scale its public path cannot reach is not delivered, and the freeze would have fixed a dense-only signature for v4."
    release: "v3.13.0"
    implementation_status: "implemented (v3.13.0)"
    test_status: "tests/unit/portfolio_optimizer/test_construction_over_a_factor_structure.py::test_a_thousand_assets_through_the_public_path_write_nothing_out; tests/unit/portfolio_optimizer/test_construction_over_a_factor_structure.py::test_a_matrix_problem_keeps_the_identity_v3_12_gave_it; tests/unit/analytics/test_factor_structure_as_a_covariance.py::test_the_euler_decomposition_through_the_factors_is_the_dense_one"
    benchmark_status: "benchmarks/benchmark_construction_scaling.py judges the structure path (4,000 assets over 1,000, ceiling 10x; 6.0x on the release tree). docs/audit/scripts/stress_v3_13.py factor, on the release tree. Stated by its structure, 1,000 / 4,000 / 10,000 assets: 0.01 / 0.05 / 0.12 s CPU and 0.6 / 2.3 / 6.0 MB traced to build; construct 0.12 / 0.73 / 1.85 s (budget, long-only, 5% cap, k = 5). Written out, 1,000 / 2,000 / 4,000 assets: 1.30 / 5.64 / 29.26 s and 83 / 329 / 1,317 MB traced; construct 0.27 / 1.04 / 4.34 s."
    documentation_status: "ADR-0048 decision 16; CHANGELOG [3.13.0]; the analytics.risk_model and portfolio_optimizer.construction docstrings"
    api_impact: "additive: FactorStructure.of, assets, currency, period, source, covariance_id, index, variance, volatility, matrix; FACTOR_STRUCTURE_SCHEME; ConstructionProblem.covariance, euler_decomposition and factor_risk take CovarianceMatrix | FactorStructure. FactorStructure.implied and rows() write the matrix out on each read rather than holding it."
    architecture_impact: "none: no package and no package edge"
    performance_impact: "positive: a factor model reaches 10,000-asset construction in about 2 s through the public API (0.12 s to state, 1.85 s to construct); writing one out costs what it did in 3.12.0 (1.45 s against 1.40 s at 1,000 assets, 5.96 s against 6.19 s at 2,000), its finiteness and symmetry now checked in bulk"
    v4_required: true
    v4_disposition: "REPLACE"
    verified: "v3.13: identities v3.12.0 computed for problems over a matrix, dense and structured, reproduced; weights over a structure equal those over its matrix; the structured path never writes it out (a test that refuses the write-out)"
    v313_outcome: "Replaced, as above. Two designs were rejected: a dense matrix written out lazily inside the frozen value (every v3.8 value is changed only while it is constructed; tests/regression/test_v38_invariants.py holds it), and an identity for factor_model's matrix derived from its structure (every identity 3.12 released for a factor-model covariance would have moved)."
  - id: "DOC-008"
    category: "documentation"
    subsystem: "docs"
    module: "nowandfuture.md; docs/ARCHITECTURE.md (Implementation Status); docs/ENGINEERING_GUIDELINES.md (Release Checklist); docs/SYSTEM_DESIGN.md; docs/GETTING_STARTED.md; docs/VISION.md; docs/STATE_MODEL.md; README.md; docs/README.md"
    finding: "Current-state documents that had stopped being re-read. nowandfuture.md's identity table gave the version as 3.9.0 at 3.12.0, with a status line naming v3.10.0 and v3.11.0 as the latest releases; its footer listed updates through v3.9.0; a blank line split its release-history table, so the last two rows did not render; section 17 listed v3.11's delivered items and v3.13's as planned; section 13 pointed to a super-linear term v3.12 had removed; section 20 called scales unmeasured that v3.12's stress program measured. docs/ARCHITECTURE.md's Implementation Status -- the section it calls authoritative -- called three rows 'deliberately deferred' that v3.11, v3.12 and v3.13 had delivered (execution-path delivery of external information; estimated, EWMA and factor-model covariances; venue sequence numbers, persisted bindings, multi-broker reconciliation, the optimal split and estimated urgency), and still described one construction solver. The release checklist in docs/ENGINEERING_GUIDELINES.md named 65 examples and 53 benchmarks and none of the API manifest, its history or the certificate. Five design documents (SYSTEM_DESIGN, GETTING_STARTED, VISION, ENGINEERING_GUIDELINES, STATE_MODEL) still drew or listed the Strategy Studio and the Workbench, which left in v3.11; three said the broker connector exports the canonical types under historical names, which v3.13 itself removed; and nowandfuture.md's frozen invariant 55 gave portfolio_optimizer's import edges without the conventions edge v3.11 added. docs/api/PUBLIC_API.md counted 2,466 exports when the manifest held 2,479. docs/GETTING_STARTED.md's repository overview counted 50 packages, 59 benchmarks, 44 ADRs, 65 examples and 7,387 tests. No version marker but the CHANGELOG's was tested, and nothing held the ledger's claim that nothing is left for later."
    evidence: "v3.13 re-read of the current-state documents against the code."
    severity: "low"
    current_state: "The identity table stale since 3.10.0; the rest since 3.12.0."
    required_change: "FIX: correct each document; test every version marker -- README's version row and current-release line, docs/README.md's Version block, ARCHITECTURE.md's Implementation Status heading, reference and footer, nowandfuture.md's header and identity table -- against alphalab.__version__; test that every ledger entry is implemented or kept, that none is assigned beyond this release, that no current-state document calls anything deliberately deferred, and that every item ROADMAP planned before v4 is delivered."
    rationale: "'A document that was true when written and was never re-read' is the second most expensive failure mode nowandfuture.md itself names."
    release: "v3.13.0"
    implementation_status: "implemented (v3.13.0)"
