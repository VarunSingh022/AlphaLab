  - id: "ALC-001"
    category: "correctness"
    subsystem: "allocation"
    module: "alphalab/allocation/engine.py:allocate; validation.validate_net_quantity"
    finding: "AllocationConstraints(allow_shorting=False) refuses any negative net delta, including a sale that closes an existing long, because allocation nets deltas without seeing positions."
    evidence: "probes/p1_risk_sell.py (long-only close refused); examples/11_unified_backtest.py comment admits it."
    severity: "high"
    current_state: "Long-only enforcement is unusable: long-only strategies must disable it to sell at all."
    required_change: "Pass current signed positions (as a Mapping[str, Decimal] of numbers, preserving the allocation->portfolio boundary) and check the projected post-trade position."
    rationale: "Constraint semantics must be about positions, not deltas."
