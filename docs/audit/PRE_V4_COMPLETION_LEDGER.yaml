  - id: "NUM-014"
    category: "numerical"
    subsystem: "crypto"
    module: "alphalab/crypto/perpetual.py:compute_liquidation_price"
    finding: "compute_liquidation_price returned E(1 - 1/L + m) for a long for every venue as \"the standard simplified formula\": exact only when maintenance margin is charged on entry notional, and wrong when it is charged on mark notional (then E(1 - 1/L)/(1 - m)); fees and accrued funding were ignored; and it divided in the caller's decimal context."
    evidence: "v3.13 audit: the isolated-margin equation derived for both maintenance bases; the result moved with the ambient decimal context."
    severity: "medium"
    current_state: "Shipped since 1.38."
    required_change: "Solve the isolated-margin equation for a stated maintenance basis, with quantity, fees and funding as inputs, in the accounting context. A venue's tiered rates, mark smoothing, insurance fund and auto-deleveraging stay the venue's."
    rationale: "A liquidation price is a risk figure positions are sized against; one that assumes one venue's convention is wrong on every venue that uses the other."
    release: "v3.13.0"
    implementation_status: "implemented (v3.13.0)"
    test_status: "tests/unit/crypto/test_crypto.py::test_on_mark_notional_the_requirement_moves_with_the_price; tests/unit/crypto/test_crypto.py::test_fees_bring_liquidation_closer_and_received_funding_pushes_it_away; tests/unit/crypto/test_crypto.py::test_the_result_does_not_depend_on_the_callers_decimal_context"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.13.0; ADR-0048; example 38"
    api_impact: "breaking"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "REPLACE"
    verified: "unit tests against the derived closed forms"
    v313_outcome: "compute_liquidation_price(entry_price, side, leverage, maintenance_margin_rate, *, basis, quantity, fees, funding) with MaintenanceBasis.ENTRY_NOTIONAL and MARK_NOTIONAL, in the accounting context. With s = +1 for a long and -1 for a short and IM the posted margin: on entry notional M = E + s(mQE - IM - funding + fees)/Q; on mark notional M = (sQE - IM - funding + fees)/(Q(s - m)). None for a long that no fall in price can liquidate; refused: a non-finite input, a rate outside [0, 1), negative fees, and a position already at its maintenance margin when it opens."
  - id: "PRF-011"
    category: "performance"
    subsystem: "runtime"
    module: "alphalab/runtime/checkpoint.py; alphalab/oms; alphalab/execution"
    finding: "A v3.12 checkpoint segment wrote the OMS order book, the completed orders and the execution reports by order whole, so every segment carried every order the run had placed -- about a kilobyte per order (505 bytes in the order book, 51 in the completed set, 432 in the reports) -- and segments grew with the run. The in-memory per-order state itself -- the order book, the reports by order, a live session's routed and settled orders -- grows with the orders a run places."
    evidence: "PRF-004's stress note (a 20,000-record chain: base 1.57 MB, last segment 1.96 MB); v3.13 measurement of each map's bytes per order."
    severity: "medium"
    current_state: "Segments: shipped in 3.12.0. Memory: since the OMS."
    required_change: "IMPLEMENT: write the entries added or replaced since the previous checkpoint and merge them by key on read, checking each map's size; write the maps whole only when the mark cannot say what changed. EXPLICIT UNAVOIDABLE LIMITATION for the in-memory state, stated: exactly-once handling of a venue's late or repeated report needs the order it names."
    rationale: "An incremental chain whose links grow with history is not incremental; the memory is what correctness against a venue that reports late costs."
    release: "v3.13.0"
    implementation_status: "implemented (v3.13.0); per-order memory kept as a stated limitation"
    test_status: "tests/regression/test_checkpoints.py::test_a_segment_costs_the_same_late_in_a_run_as_early; tests/regression/test_checkpoints.py::test_a_segment_writes_the_orders_that_changed_and_no_others; tests/regression/test_checkpoints.py::test_a_chain_v3_12_wrote_reads_back_as_its_full_capture; tests/regression/test_checkpoints.py::test_a_tampered_map_header_is_refused"
    benchmark_status: "measured: 2,000 records with an order each, checkpointed every 500"
    documentation_status: "CHANGELOG 3.13.0; ADR-0048; ROADMAP known defects; docs/STATE_MODEL.md"
    api_impact: "none"
    architecture_impact: "persistence"
    performance_impact: "improved"
    v4_required: true
    v4_disposition: "IMPLEMENT"
    verified: "measured; regression tests"
    v313_outcome: "runtime.CheckpointMark.entries keeps each per-order map's entries at the mark; a segment writes only those added or replaced since (checkpoint schema 2: a maps header with each map's size and whether it is whole), and the reader merges by key, checks the size, and requires a chain's base to be whole. A mark rebuilt from its digest and ends writes the maps whole, as 3.12 did; a 3.12 chain is read. 2,000 records with an order each, checkpointed every 500: the fourth segment was 6.39 MB and is 5.01 MB, and the segments are flat across the run. Memory: kept as an EXPLICIT UNAVOIDABLE LIMITATION, stated in ROADMAP and ADR-0048 -- retention bounds the logs, not the per-order state."
