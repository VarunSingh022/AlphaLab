  - id: "PRF-006"
    category: "performance"
    subsystem: "portfolio/oms/common"
    module: "alphalab/portfolio/{engine,book}.py; alphalab/common/persistent_map.py; alphalab/oms/engine.py"
    finding: "v3.10 raised the per-operation constant: run side by side on one machine, v3.9.0 -> v3.10.0 benchmark wall time is 2.2x for the OMS (12.0 -> 26.4 s; accept-and-fill 21.6k -> 6.1k/s at 40k orders), 1.95x for the portfolio engine (3.7 -> 7.2 s; 28.2k -> 14.2k fills/s), 1.37x for a one-asset backtest (7.8 -> 10.7 s) and 1.36x for the execution pipeline (3.9 -> 5.3 s). By profile and by elimination: PositionBook upkeep on every fill (PRF-001's exact totals), PersistentMap compaction bookkeeping and rebase copies (PRF-002; in isolation, inserting is 1.7x, draining 3.75x and overwriting 3.2x slower, reading unchanged), the OMS per-asset working index (PRF-001), and the pinned context and per-currency unit lookups on every fill."
    evidence: "side-by-side benchmark runs and cProfile of apply_fill and the OMS accept-and-fill stage, v3.9.0 vs v3.10.0, in the v3.10 release gates"
    severity: "medium"
    current_state: "Accepted for v3.10.0 and stated in its CHANGELOG: the same changes make the canonical path linear in the universe (10 assets 1.85x faster than v3.9, 80 assets about 7x), and no correctness depends on the constant."
    required_change: "An optimization pass with a v3.9-relative budget on one-asset paths: a cheaper rebase copy (a newest-view fast path measured 15-20% on draining), no default set built per OMS update and no write for an unchanged index (about 8% on accept-and-fill), and PositionBook totals updated without re-deriving both entries per fill."
    rationale: "A correctness release may cost time, but the cost has to be known, stated and bounded."
    release: "v3.11.0"
    implementation_status: "implemented (v3.11.0)"
    test_status: "tests/regression/test_prf006_fast_paths.py"
    benchmark_status: "measured side by side (v3.9.0 / v3.10.0 / v3.11.0); benchmarks/benchmark_{oms,portfolio_engine,backtesting,execution_pipeline}.py"
