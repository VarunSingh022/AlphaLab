    v312_outcome: "A covariance from factor_model carries its FactorStructure; construction solves it with portfolio_optimizer.solve_factor_quadratic_program -- a Mehrotra interior point whose Newton step costs O(n k^2) (per-asset blocks, Woodbury over the loadings, Schur over the coupling rows), finished exactly on the binding set and certified by the dense solver's own criteria; anything it cannot certify goes to the dense solver, which alone says INFEASIBLE. Measured QP-only CPU s (mean-variance, long-only, 5% cap, k=5): dense 0.02 / 0.13 / 1.25 / 11.8 / 134.6 at 50 / 100 / 200 / 400 / 800 assets; structured 0.01 / 0.01 / 0.02 / 0.03 / 0.14, and 0.60 at 3,200, 1.61 at 10,000. Fuzz against the dense solver: 2,665 programs both OPTIMAL, no disagreement, worst |dx| 2.4e-8."

