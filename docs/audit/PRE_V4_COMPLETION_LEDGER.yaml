    module: "alphalab/lifecycle/health.py:_risk_findings"
    finding: "A v3.10 regression, caught before release: once RiskViolation.severity became a RiskSeverity member, a health finding's detail (Mapping[str, str]) carried the enum member rather than its string, so the 'machine-readable' detail printed as <RiskSeverity.CRITICAL: 'CRITICAL'>."
    evidence: "golden example comparison (example 43); tests/unit/lifecycle/test_health.py"
    severity: "low"
    current_state: "Fixed in v3.10.0: the detail carries severity.value; example 43 prints what v3.9 printed."
    required_change: "Carry the string value."
    rationale: "A str mapping holds strings."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/unit/lifecycle/test_health.py::TestRiskBreach::test_a_violation_is_carried_rather_than_re_decided"
