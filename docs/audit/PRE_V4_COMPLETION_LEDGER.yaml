    severity: "low"
    current_state: "Stated in ADR-0043 since v3.8; no ledger entry until v3.13."
    required_change: "Classify each. EXPLICIT UNAVOIDABLE LIMITATION: maximum diversification is solved through a change of variables that a turnover limit or a volatility cap does not survive; risk parity's exact budgets define its one solution, which a book that may short does not have; a cap on one bucket's Euler contribution inside another objective is not a convex constraint. EXPLICIT EXTERNAL BOUNDARY: other investors' positions, which crowding beyond the portfolio would need. KEEP as stated convention: a Position's quantity is in the underlying's units and its economics are booked through InstrumentEconomics (ACC-005); a return series is converted by whoever owns its rates, never implicitly (BDY-009); limit shares against free capital and base-currency translations rounded once are stated where they are computed; the spread in the v1 estimate is v3.8's correction, recorded, not open."
    rationale: "A limitation an ADR states is a finding like any other; one the ledger does not hold is one nobody re-reads before a freeze."
