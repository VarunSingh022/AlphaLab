    v313_outcome: "Corrected; held by the tests."
  - id: "TST-016"
    category: "tests"
    subsystem: "lifecycle; crypto; runtime"
    module: "alphalab/lifecycle/rerun.py; alphalab/crypto/perpetual.py; alphalab/runtime/checkpoint.py"
    finding: "Seven v3.13 rules that no test pinned, found by the v3.13 defect-injection harness (docs/audit/scripts/mutation_v3_13.py) -- each mutant passed the whole suite: a rerun over other bytes under the recorded dataset version (Y23) or on another engine source (Y24) was not refused; the rerun's stated limit of ten differences could change unnoticed, because the tests read the constant (Y27); the mark-notional liquidation price could drop the position's fees (Y37); and a checkpoint segment could omit an order entry replaced since the last link (Y40), merge a map that lost or reordered an entry instead of writing it whole (Y41, Y43). The canonical path never removes an order, so the last two are reachable only through a state built by hand."
    evidence: "v3.13 defect-injection run (master audit W.5); each survivor re-checked against the new test by applying the mutant to the working tree."
    severity: "medium"
    current_state: "Rules stated in the code and the ADR, unpinned."
    required_change: "FIX: a test for each rule, failing on each mutant: each recorded rerun input compared on its own and named (the dataset's bytes, the engine's source, its zone database); the ten-difference limit pinned by value on a divergence with 184 differing paths; the liquidation equation checked at the returned price on either basis and side, fees and funding included; a run with next-event fills, whose segments must carry each replaced order, and hand-built states that lost or reordered an order entry, which must be written whole."
    rationale: "A rule no test pins is a rule a later change can drop silently; the harness exists to find them."
    release: "v3.13.0"
    implementation_status: "implemented (v3.13.0)"
    test_status: "tests/unit/lifecycle/test_rerun_harness.py::test_each_recorded_input_is_compared_on_its_own_and_named; tests/unit/lifecycle/test_rerun_harness.py::test_a_divergence_is_reported_with_where_the_records_part; tests/unit/crypto/test_crypto.py::test_at_the_price_returned_equity_is_exactly_the_requirement; tests/regression/test_checkpoints.py::test_an_order_that_changed_between_checkpoints_is_written_by_its_change; tests/regression/test_checkpoints.py::test_a_map_that_lost_or_reordered_an_entry_is_written_whole"
    benchmark_status: "n/a"
    documentation_status: "master audit W.5; CHANGELOG [3.13.0]"
    api_impact: "none"
    architecture_impact: "none"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "v3.13: each mutant applied to the working tree fails its new test"
    v313_outcome: "Pinned; on the release tree every v3.13 mutation is caught (master audit W.5)."
  - id: "REP-004"
    category: "reproducibility"
    subsystem: "release certification; repository"
    module: "docs/audit/scripts/certify_release.py; .gitattributes"
    finding: "The release certificate names the engine source it certified (its build's source digest), and nothing held the name to the build: --check compared what the build computes -- the release, the verdict, every check's evidence -- and not which build it is. At v3.13.0's release candidate (commit b6a0fef) the committed certificate named the source as it stood before two commits that changed only docstrings, and every gate passed, CI's --check and the defect-injection baseline included; only regenerating the certificate last, by procedure, corrected it. And the digest is over bytes: Git rewrites line endings on checkout where core.autocrlf is set, as Git for Windows sets it by default, so a checkout of the same commit there would be other engine source -- to the certificate and to a rerun from a manifest -- although ruff already formats every file with LF."
    evidence: "v3.13 release gates: certify_release.py regenerated last changed only the source digest (046a18dc... to 62ce6687...); the b6a0fef certificate, checked by the new --check, is refused with both digests named."
    severity: "low"
    current_state: "The certificate's build identity unheld since FEA-006 (v3.13); the engine digest dependent on the checkout's line endings since REP-002 (v3.11)."
    required_change: "FIX: --check also fails when the committed certificate certifies other engine source than the build's, naming both digests; the host -- Python, platform, time-zone database -- stays recorded, not compared. A test holds the committed certificate to the engine's digest; the defect-injection harness leaves it out, since every mutation of the engine changes the digest by construction. .gitattributes checks every Python file out with LF on every platform, and a test holds that and that no engine source holds a carriage return."
    rationale: "A certificate that does not name the build it certified certifies nothing in particular; a source identity that depends on how a checkout was configured is not an identity of the source."
    release: "v3.13.0"
    implementation_status: "implemented (v3.13.0)"
    test_status: "tests/regression/test_release_certification.py::test_the_committed_certificate_certifies_this_source; tests/regression/test_release_certification.py::test_check_refuses_a_certificate_of_other_source_or_evidence; tests/regression/test_release_certification.py::test_every_checkout_reads_the_engine_source_byte_for_byte"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG [3.13.0]; docs/ENGINEERING_GUIDELINES.md release checklist; docs/audit/RELEASE_CERTIFICATION.md; master audit W.5"
    api_impact: "none"
    architecture_impact: "none"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "v3.13: the certificate committed at b6a0fef is refused by the new --check; mutations Y57 (the source comparison dropped) and Y58 (a check's moved evidence dropped) each fail the new test"
    v313_outcome: "Fixed and held; the v3.13.0 certificate names the released source."
