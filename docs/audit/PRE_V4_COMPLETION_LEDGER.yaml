  - id: "ACC-004"
    category: "determinism"
    subsystem: "portfolio/oms/broker/core"
    module: "alphalab/portfolio/money.py; oms/order.py:_filled_by; broker/reconciliation.py:apply_execution; core/order_request.py:notional_value"
    finding: "Monetary rounding (quantize without explicit rounding) and VWAP divisions run in the caller's ambient decimal context; v3.9 fixed only split_by_contribution."
    evidence: "Code review: to_money uses amount.quantize(CURRENCY_QUANT) with context rounding; average fill price divisions use context precision."
    severity: "high"
    current_state: "A thread that changes getcontext() changes the books."
    required_change: "One pinned accounting context (prec=34, ROUND_HALF_EVEN) used by every accounting/execution arithmetic site; a regression sweep for ambient-context arithmetic on those paths."
    rationale: "Determinism must not depend on thread-local state."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/unit/portfolio/test_monetary_precision.py; tests/regression/test_ambient_decimal_context.py"
