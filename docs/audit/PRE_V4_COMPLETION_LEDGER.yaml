    finding: "Several v1 'engine series' packages are bookkeeping shells or duplicates: plugins (execute() is a NotImplementedError placeholder), scheduler (see DAT-006), distributed (a job table that executes nothing; cancel stores a cancelled job as failed without an event), reporting (dashboards = presentation), optimizer and research_assistant (two of four parameter-search implementations)."
