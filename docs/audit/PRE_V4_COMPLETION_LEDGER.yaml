    v4_disposition: "FIX"
    verified: "probe + defect injection (unpinning LiveSession alone -> InvalidOperation)"
    v311_outcome: "Every public staticmethod of ExecutionPipeline, RunEngine and LiveSession runs in ACCOUNTING_CONTEXT (exempt: publish_record, resume); structural test by wrapper code identity; backtest and live oracles at precisions 3, 5 and 8."
  - id: "NUM-013"
    category: "numerical"
    subsystem: "conventions"
    module: "alphalab/conventions/lot.py"
    finding: "Lot arithmetic ran in the caller's decimal context: round_down_to_lot divided before flooring, so it could round a quantity UP -- 12345.9 at precision 5 returned 12346, and 0.(31 nines) at precision 28 returned 1."
    evidence: "Probe against the v3.10.0 tree (both values reproduced)."
    severity: "medium"
    current_state: "Shipped since v3.4."
    required_change: "Compute lot counts, remainders and rounded quantities exactly (Inexact trapped) at the accounting precision; refuse what cannot be counted exactly."
    rationale: "Rounding a position 'down' must never add exposure."
    release: "v3.11.0"
    implementation_status: "implemented (v3.11.0)"
    test_status: "tests/unit/conventions/test_conventions.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.11.0; ADR-0046"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "probe; the new tests fail on the v3.10 code (4)"
    v311_outcome: "Exact context (precision 34, Inexact trapped): divide_int and multiply keep the representation the lot gave; a quantity too long to count raises ConventionViolationError."
