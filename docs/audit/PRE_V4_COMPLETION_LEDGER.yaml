    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "IMPLEMENT"
    classification: "REQUIRED FOR V4"
    verified: "--check fails when a check's recorded evidence is altered"
    v313_outcome: "Moved from v4.0.0 and implemented: docs/audit/scripts/certify_release.py writes docs/audit/release_certification.json and its rendering RELEASE_CERTIFICATION.md -- eleven checks of determinism (one process; fresh interpreters under two hash seeds; a six-digit ambient decimal context), parity (backtest, replay and paper; live orders), reproducibility (a rerun from the manifest; a stop and continue; every golden payload), published numerical references (Hull's Black-Scholes-Merton example and American-put table, normal-distribution values, a NIST NumAcc-style series) and the public API. CI runs it with --check, which fails when a check fails or its evidence moves."
