    subsystem: "allocation"
    module: "alphalab/allocation/sizing.py:VolatilityTargetSizing"
    finding: "A missing volatility silently defaults to 1% (vols.get(asset, 0.01)) and a non-positive one is replaced by 1%, producing oversized positions; FixedDollar/TargetWeight/EqualWeight sizing return 0 for a non-positive price, hiding the request from unpriced-asset reporting."
    evidence: "Code review."
    severity: "high"
    current_state: "Silent financial defaults in sizing; the no-silent-defaults sweep misses .get fallbacks."
    required_change: "Refuse sizing with a missing or non-positive volatility; never size against a non-positive price (surface as unpriced)."
    rationale: "Invariant 5: no invented financial value."
