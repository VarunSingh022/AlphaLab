  - id: "RSK-006"
    category: "api"
    subsystem: "risk"
    module: "alphalab/risk/models.py:RiskViolation.severity; alphalab/risk/checks.py:check_margin"
    finding: "RiskViolation.severity is a free string; the margin model is 'full notional requires margin' against cash with utilization computed only when available margin > 0 (vacuous pass at zero cash)."
