    category: "security_reliability"
    subsystem: "market"
    module: "alphalab/market/stream.py:StreamingSource._read"
    finding: "On a failed connection the reconnect path drops the old WebSocket without closing its socket: every reconnect leaks a file descriptor until garbage collection (ResourceWarning)."
    evidence: "pytest -W error: 5 streaming tests fail and one unrelated test errors when GC finalizes the leaked socket. Passes without -W error, so CI is blind to it."
    severity: "high"
    current_state: "fd leak per reconnect in long-running live streams."
    required_change: "Close the transport's socket on every failure path (idempotent close) and run the suite with ResourceWarning as an error in CI."
    rationale: "Reliability of live sessions."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_websocket_releases_its_socket.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "test run with -W error"
    v310_outcome: "Every failure path releases the socket; CI runs -W error."
