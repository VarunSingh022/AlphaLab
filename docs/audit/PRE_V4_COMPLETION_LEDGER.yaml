  - id: "PER-001"
    category: "architecture"
    subsystem: "persistence"
    module: "alphalab/persistence/decode.py:require_schema_version; all snapshot modules"
    finding: "Each snapshot subsystem reads exactly one schema version and 'there is no migration path'. After a long-lived v4 freeze, any fix that needs a new durable field makes every earlier payload unreadable; several deferred items (BRK-002/003) are blocked on it."
    evidence: "nowandfuture.md s9 and s14 invariant 2."
    severity: "high"
    current_state: "Schema evolution impossible without abandoning stored state."
    required_change: "Explicit, versioned, tested upgrade functions per subsystem (vN -> vN+1, pure, composable), invoked before typed decoding; every historical version kept readable by golden payload fixtures."
    rationale: "Long-term compatibility for a frozen library; v3.10's own fixes add durable fields (fill timing, daily-loss day boundary) and need it first."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_schema_upgrades.py; tests/fixtures/snapshots/v3.9.0"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "none"
    architecture_impact: "cross-package"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "IMPLEMENT"
    verified: "documentation"
    v310_outcome: "SchemaHistory/SchemaStep for all ten subsystems; portfolio 3->4, pipeline 3->4, run 1->2; golden v3.9.0 payloads."
