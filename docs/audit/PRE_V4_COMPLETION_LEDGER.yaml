    finding: "ADR-0043 (v3.8) stated sixteen known limitations, and the pre-v4 ledger recorded none of them. Seven are classified by entries that exist or that v3.13 adds (FEA-007, FEA-009, RSK-007, OFE-002, OFE-003, OFE-015, PRF-005); nine stand: share semantics (a Position carries no multiplier); crowding measured within the portfolio; return series required in one currency; maximum diversification without a turnover limit or volatility cap; risk parity with exact budgets, long only; risk budgets entering construction only as exact budgets or a volatility cap; capital limit shares measured against total free capital; base-currency capital figures as translations; and the v1 cost estimate's spread."
