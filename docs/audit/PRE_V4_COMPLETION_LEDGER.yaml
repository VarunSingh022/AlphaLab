    architecture_impact: "local"
    performance_impact: "improves"
    v4_required: true
    v4_disposition: "FIX"
    verified: "stress probe"
    v310_outcome: "PositionBook exact per-currency totals; pending_marks; mark_changed; persistent price map; one valuation per event. per-record cost across 50 -> 400 assets 0.85x-1.24x over four release-gate runs (663-918 us a record). Deliberate numeric change: mixed-currency books convert each currency's totals once."
  - id: "PRF-002"
    category: "performance"
    subsystem: "common"
    module: "alphalab/common/persistent_map.py:PersistentMap"
    finding: "PersistentMap never reclaims superseded versions: iteration costs O(keys ever written) and memory grows with total writes; order_shares_by_strategy iterates allocation.contributions every event, which is O(orders ever placed) under EXTERNAL routing."
    evidence: "probes/p4_broker_misc.py: 1 live key after 10k/20k/40k churn -> 0.133s/0.291s/0.611s per 100 iterations (linear in history)."
    severity: "high"
    current_state: "Live sessions degrade quadratically; memory unbounded."
    required_change: "Amortized compaction: when dead entries exceed live entries a write rebases onto a fresh store holding only live keys (older views keep their store); iteration O(live)."
    rationale: "Long-lived live use."
