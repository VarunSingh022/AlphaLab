  - id: "PRF-004"
    category: "performance"
    subsystem: "runtime/persistence"
    module: "alphalab/runtime/snapshot.py; market/state.py; portfolio/engine.py"
    finding: "Every durable state keeps its complete event history in memory and every checkpoint serializes all of it; long live sessions grow without bound and periodic checkpoints cost O(N) each (O(N^2) total)."
    evidence: "Code review of snapshot records (market history, risk history, execution history, portfolio events, steps)."
    severity: "high"
    current_state: "No retention or incremental checkpoint."
    required_change: "Declared retention policies for derived histories (bounded market history window for HistoryView; step log retention), and incremental checkpoints (base snapshot + appended segments) with digest chaining."
    rationale: "Months-long live runs."
    release: "v3.12.0"
    implementation_status: "implemented (v3.12.0)"
    test_status: "tests/regression/test_retention.py; tests/regression/test_checkpoints.py; tests/unit/common/test_append_log.py"
    benchmark_status: "benchmarks/benchmark_runtime.py: a checkpoint segment at most half a full capture (measured 0.13x); stress: 20,000 records, 20 checkpoints"
    documentation_status: "CHANGELOG 3.12.0; ADR-0047"
    api_impact: "none"
    architecture_impact: "cross-package"
    performance_impact: "improves"
    v4_required: true
    v4_disposition: "IMPLEMENT"
    verified: "code review"
    v312_outcome: "RetentionPolicy(market_history, steps, audit_events, results) on ExecutionPipelineConfig (default keeps everything), trimmed between records with an eighth of slack; AppendOnlyLog offset views, retain_last in O(1) amortized and a dropped count. History beyond the window is refused (HistoryNotRetainedError), never answered short. runtime.checkpoint: a base capture then segments of what each log appended, chained by sha256; a missing, reordered, altered or substituted link is refused on read. Measured at 2,000 records: full capture 1.05 s / 11.5 MB against a segment 0.13 s / 2.0 MB; with retention 500 the full capture plateaus at 3.3-3.75 MB; retention costs 1.04-1.06x. Stated and not bounded: the OMS order book, execution reports by order, a live session's routed and settled orders -- a segment carries the whole order book (20,000-record stress chain: base 1.57 MB, last segment 1.96 MB)."

