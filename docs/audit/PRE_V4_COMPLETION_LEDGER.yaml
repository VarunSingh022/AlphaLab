    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "code review"
    v310_outcome: "ACCOUNTING_CONTEXT (prec 34, half-even, traps); full backtest byte-identical under five hostile ambient contexts."
