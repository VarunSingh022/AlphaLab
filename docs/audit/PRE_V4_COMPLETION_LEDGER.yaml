    release: "v3.13.0"
    implementation_status: "implemented (v3.13.0)"
    test_status: "tests/regression/test_release_certification.py::test_the_build_matches_its_committed_certificate; tests/regression/test_release_certification.py::test_the_certificate_is_this_releases_and_it_passed"
