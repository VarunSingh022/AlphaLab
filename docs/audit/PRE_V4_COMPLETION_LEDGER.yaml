  - id: "RES-001"
    category: "research_integrity"
    subsystem: "research"
    module: "alphalab/research/{metrics,bias,capacity,regime,cross_validation,bootstrap,research}.py"
    finding: "The v1 research engine (ResearchEngine.run_full_research) assumes a daily return series (calculate_sharpe annualizes with a hard-coded 252) and scores with uncalibrated constants (capacity decay 0.01/0.05/0.15 per 10,000 trades, bias thresholds, an overall score), duplicating the v3.2 validation authority."
    evidence: "found by the v3.10 defaults sweep; code review"
    severity: "medium"
    current_state: "Daily assumption stated in its docstrings and exempted by name in the defaults sweep."
    required_change: "Consolidate into the one research authority with SCF-003: remove the heuristic scores or restate them over the v3.2 methodology; no default annualization."
    rationale: "Heuristic scores presented as research diagnostics mislead."
    release: "v3.12.0"
    implementation_status: "implemented (v3.12.0)"
    test_status: "tests/unit/research/test_research.py; tests/regression/test_no_silent_financial_defaults.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.12.0; ADR-0047"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "REPLACE"
    verified: "found while implementing v3.10.0 (API-003 sweep)"
    v312_outcome: "The v1 research engine restated over the v3.2 methodology: calculate_cagr / volatility / sharpe take periods_per_year (and the Sharpe a risk_free_rate), required and validated -- no 252 anywhere; ResearchScore and the 0-100 scores replaced by ResearchPolicy (every bound stated, no defaults) and research_metrics (measurements; unmeasured omitted, never zero); every report a measurement; run_full_research(state, payload, policy, timestamp, seed); lifecycle.evidence_from_research records the measurements. The three RES-001 exemptions in the defaults sweep removed."

  - id: "DET-005"
    category: "determinism"
    subsystem: "portfolio"
    module: "alphalab/portfolio/multi_strategy.py:book_id/valuation_id"
    finding: "A v3.10 regression, caught before release: once CurrencyAmounts stopped rounding every amount to a cent (and prices and quantities stopped being quantized), the multi-strategy book and valuation identities -- which hashed each Decimal's text -- gave two books that compare equal ('250000' vs '250000.00' of unassigned capital; a position of 100 at 10 vs 100.0 at 10.00) two identities. v3.9 gave them one."
    evidence: "golden example comparison (example 58); probe; tests/regression/test_identity_is_by_value.py fails with the pre-fix rendering"
    severity: "medium"
    current_state: "Fixed in v3.10.0: amounts enter both identities through alphalab.common.arithmetic.canonical_text (one text per number, never rounded); schemes alphalab.multi_strategy_book.v2 and alphalab.book_valuation.v2. The reconciliation identities (BRK-001) use the same function."
    required_change: "Render every amount in an identity by value."
    rationale: "An identity derived from content must not distinguish equal content."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_identity_is_by_value.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "addition"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "found in the v3.10 example review; a v3.10 regression, so the pin passes against v3.9.0 and fails against the pre-fix tree"
  - id: "DET-006"
    category: "determinism"
    subsystem: "cross-cutting"
