  - id: "PRF-001"
    category: "performance"
    subsystem: "runtime/portfolio"
    module: "alphalab/portfolio/engine.py:update_market_prices; runtime/execution_pipeline.py"
    finding: "The canonical path is quadratic in universe size: every event re-marks and logs every held position, recomputes exposure/NAV/valuation over all positions (twice) and copies the whole price map."
    evidence: "probes/p2_multiasset_scale.py: N=10..160 assets x 50 bars -> cpu 0.56s, 1.58s, 4.74s, 14.8s, 54.8s; peak memory 2.5MB..337MB; 1.27M logged marks at N=160. Extrapolated 500 stocks x 10y daily: ~27,000 cpu-s and ~170 GB."
    severity: "critical"
    current_state: "A realistic cross-sectional backtest cannot run on the canonical path."
    required_change: "Mark only the asset the event re-priced; maintain exact incremental aggregates (long/short value per currency, gross/net exposure); log only changed marks; persistent price map; equity curve bit-identical to v3.9 on single-asset runs."
    rationale: "Worldwide multi-asset use."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_universe_scaling.py; tests/unit/portfolio/test_position_book.py; tests/unit/portfolio/test_mixed_book_valuation.py; benchmarks/benchmark_universe_scaling.py"
