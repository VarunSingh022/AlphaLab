  - id: "SCF-003"
    category: "obsolete"
    subsystem: "plugins/scheduler/distributed/reporting/optimizer/research_assistant"
    module: "alphalab/plugins; scheduler; distributed; cluster_scheduler; reporting; optimizer; research_assistant"
    finding: "Several v1 'engine series' packages are bookkeeping shells or duplicates: plugins (execute() is a NotImplementedError placeholder), scheduler (see DAT-006), distributed (a job table that executes nothing; cancel stores a cancelled job as failed without an event), reporting (dashboards = presentation), optimizer and research_assistant (two of four parameter-search implementations)."
    evidence: "Code review."
    severity: "medium"
    current_state: "Unclear authority and scaffolding in the public API."
    required_change: "Per-package decision recorded in an ADR: consolidate parameter search into one research authority; keep distributed+cloud_research as the local parallel-execution capability (fixed); remove plugins and reporting dashboards; scheduler reduced to deterministic timers over MarketCalendar or removed."
    rationale: "Coherent library at the freeze."
    release: "v3.12.0"
    implementation_status: "implemented (v3.12.0)"
    test_status: "tests/regression/test_removed_surfaces_stay_removed.py; tests/regression/test_shared_names_stay_distinct.py; tests/unit/research/test_signal_and_robustness.py; tests/unit/research_assistant/test_research_assistant.py; tests/unit/cloud_research/test_cloud_research.py; tests/unit/distributed/test_distributed.py; tests/unit/scheduler/test_session_timers.py; tests/regression/test_every_schedule_type_is_kept.py; tests/unit/reporting/test_reporting.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.12.0; ADR-0047"
    api_impact: "removal"
    architecture_impact: "cross-package"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "REPLACE"
    verified: "code review"
    v312_outcome: "REMOVE and REPLACE, per package: alphalab.plugins removed (its execute() was a NotImplementedError placeholder; loading extensions is the host's); alphalab.optimizer removed (a second parameter search -- research.parameter_sweep, with higher_is_better, and research.walk_forward_optimize are the authority; research_assistant and cloud_research enumerate through research.ParameterSpace and count through parameter_sweep); the reporting dashboards removed (presentation; reports and their exports stay, and export_json writes a Decimal as exact text -- ANA-006); distributed kept and fixed (JobCancelled, DistributedState.cancelled_jobs, an assigned job not yet running can be cancelled and frees its slot); the scheduler reduced to deterministic timers over MarketCalendar (SESSION_OPEN / SESSION_CLOSE at each trading day's first open and last close; CRON and BAR_BOUNDARY refused at registration, a stated limitation). The removal was first refused by the permission policy of the session that built the release as irreversible; the maintainer authorized it, and it was made with git rm."

