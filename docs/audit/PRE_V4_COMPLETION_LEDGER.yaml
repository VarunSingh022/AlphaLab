  - id: "PRF-012"
    category: "performance"
    subsystem: "runtime"
    module: "the canonical one-asset paths: backtest, replay, the execution pipeline"
    finding: "Against v3.11 the one-asset paths cost more from v3.12 on: the v3.12 release measured a backtest at 1.03x, a replay at 1.07x and the pipeline at 1.00x of v3.11 (medians of five interleaved rounds), and left the cause to this audit."
    evidence: "Side by side for v3.13 (five interleaved rounds of 3.9.0, 3.11.0, 3.12.0 and 3.13.0, each benchmark's own timing): against 3.11 a backtest 1.06x (1.02-1.15), a replay 1.11x (1.04-1.14), the pipeline 1.03x (1.00-1.13), the OMS 0.99x; against 3.12 every path 0.98x-1.03x with every range spanning 1.0. Wall time with the collector on and off (five rounds, median of three): backtest 1.02x and 1.08x, replay 1.06x and 1.02x of 3.11. cProfile of a 2,000-record backtest, median of three: 2.6% more calls; no function accounts for more than about 0.6% of the run, and the difference is spread over the per-record work of the capabilities v3.12 put on the path (the subscription index, the retention, session-close, classification and strategy-ceiling checks) and over state that carries their fields (evolve, allocation, the append-only logs). The largest single entry, OrderId.__hash__, is the collector's pause charged to the next function entered: the same code in 3.11 charged it to PortfolioEngine.__post_init__, and the two sum to about 0.1 s in every tree."
    severity: "low"
    current_state: "Shipped in 3.12.0; unchanged by 3.13."
    required_change: "EXPLICIT UNAVOIDABLE LIMITATION, bounded: a run has one canonical path, and each capability on it is checked per record to learn whether this run configured it; removing the check would take a second path per configuration, which the architecture refuses. Keep PRF-006's budget as the bound and measure it at every release."
    rationale: "A cost that buys correctness and capability on the one path is stated and bounded, not hidden behind a specialized path that could drift from it."
    release: "v3.13.0"
    implementation_status: "kept as a stated limitation (v3.13.0)"
    test_status: "n/a (measurement)"
    benchmark_status: "measured side by side: benchmarks/benchmark_oms.py, benchmarks/benchmark_portfolio_engine.py, benchmarks/benchmark_backtesting.py, benchmarks/benchmark_execution_pipeline.py"
    documentation_status: "CHANGELOG 3.13.0; ADR-0048; ROADMAP known defects"
    api_impact: "none"
    architecture_impact: "none"
    performance_impact: "stated"
    v4_required: true
    v4_disposition: "KEEP_LIMITATION"
    verified: "measured and profiled in the v3.13 release gates"
    v313_outcome: "Classified as an explicit, bounded limitation. PRF-006's budget holds in every round of the v3.13 measurement: against 3.9 the OMS 0.81x (0.72-0.83), a backtest 1.14x (1.12-1.24), a replay 1.15x (1.05-1.19) and the pipeline 1.07x (1.04-1.17), all within 1.25x, and the portfolio micro-benchmark 1.61x (1.58-1.67), within 2.0x. v3.13 adds no measurable cost to 3.12."
