    v4_disposition: "FIX"
    verified: "code review"
    v310_outcome: "ACCOUNTING_CONTEXT (prec 34, half-even, traps); full backtest byte-identical under five hostile ambient contexts."
  - id: "ACC-005"
    category: "missing_capability"
    subsystem: "portfolio/runtime"
    module: "alphalab/portfolio/position.py; alphalab/runtime/execution_pipeline.py"
    finding: "The canonical path books every fill as a fully paid cash equity: no contract multiplier (Position has none by invariant 30), no futures margin/variation settlement, no option premium x multiplier; derivatives packages are analytics-only."
    evidence: "Code review of Position/PortfolioEngine.apply_fill and portfolio/contracts.py."
    severity: "high"
    current_state: "Futures and options P&L on the execution path is wrong by the multiplier or overdraws cash."
    required_change: "Instrument economics on the canonical path: an InstrumentEconomics declaration (multiplier, settlement style: CASH_EQUITY | FUTURES_VARIATION | OPTION_PREMIUM | PERPETUAL) supplied through the instrument registry; valuation and cash impact go through conventions.contract_notional (still the single multiplying site)."
    rationale: "A global multi-asset engine must trade and account derivatives correctly."
