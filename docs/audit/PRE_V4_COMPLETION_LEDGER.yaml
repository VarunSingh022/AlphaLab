  - id: "ACC-001"
    category: "numerical"
    subsystem: "portfolio"
    module: "alphalab/portfolio/money.py:CURRENCY_QUANT"
    finding: "Every currency is rounded to 0.01. JPY/KRW (0 decimals), KWD/BHD/OMR/JOD/TND (3), CLF (4) and crypto settlement assets are wrong; the module's claim 'exact at the currency's minor unit' is false."
    evidence: "Probe: JPY account deposit of 1000000.5 is stored as 1000000.50 JPY. Verified."
    severity: "critical"
    current_state: "Global multi-currency accounting mis-rounds most non-2-decimal currencies."
    required_change: "Per-currency minor units: the ISO 4217 minor-unit table as a stated standard, plus caller-declared units for non-ISO currencies; refuse settlement in a currency with no known minor unit. to_money takes the currency."
    rationale: "Worldwide use; the accounting identity must hold at each currency's real minor unit."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/unit/portfolio/test_monetary_precision.py; tests/unit/portfolio/test_portfolio.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "breaking"
    architecture_impact: "cross-package"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "empirical probe"
    v310_outcome: "common.currency_units: ISO 4217 table + CurrencyUnits declarations on Account; UnknownCurrencyUnitsError; a v3.9 book holding fractional yen is refused on upgrade."
  - id: "ACC-002"
    category: "numerical"
    subsystem: "portfolio"
    module: "alphalab/portfolio/money.py:PRICE_QUANT/to_price"
    finding: "Every fill and mark price is quantized to 4 decimal places before money is computed: a 1e9-unit purchase at 0.00001234 is booked at cost 0.00 with cash unchanged; EURUSD 1,000,000 @ 1.08345 books 1,083,400.00 instead of 1,083,450.00."
    evidence: "Probe (portfolio engine): SHIB-like fill basis 0.00; FX fill basis 1083400.00. Verified."
    severity: "critical"
    current_state: "Silent mis-booking for 5-decimal FX, low-priced crypto, sub-penny equities and fractional-tick bonds; venue fills differ from the book."
    required_change: "Keep venue/market prices exact; money is rounded once at the currency minor unit (ACC-001). Derived per-unit figures (average cost) computed in a pinned context."
    rationale: "A price is not money; the venue's price must reach the book unchanged."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/unit/portfolio/test_monetary_precision.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "breaking"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "empirical probe"
    v310_outcome: "to_price/PRICE_QUANT removed; prices exact."
