  - id: "DAT-008"
    category: "limitation"
    subsystem: "core"
    module: "alphalab/core/fill.py; common/events.py"
    finding: "All instants are float Unix seconds: resolution is about 0.24 microseconds at current epochs, so nanosecond feeds cannot be represented exactly and sub-microsecond ordering relies on record order."
    evidence: "IEEE 754 double spacing at 1.7e9 is 2.4e-7."
    severity: "low"
    current_state: "Undocumented precision envelope."
    required_change: "Document the precision envelope and require sequence-based ordering for same-instant events; no representation change (fundamental and frozen)."
    rationale: "Honest limitation."
    release: "v3.12.0"
    implementation_status: "kept as a stated limitation (v3.12.0)"
    test_status: "tests/unit/common/test_time_precision.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.12.0; ADR-0047"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "KEEP_LIMITATION"
    verified: "analysis"
    v312_outcome: "KEEP_LIMITATION, stated where instants are defined: common.time's docstring and instant_resolution(instant) = math.ulp(instant); between 2004 and 2038 an instant resolves 2**-22 s (0.24 us). A nanosecond feed is not representable exactly."

