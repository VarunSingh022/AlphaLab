  - id: "DET-005"
    category: "determinism"
    subsystem: "portfolio"
    module: "alphalab/portfolio/multi_strategy.py:book_id/valuation_id"
    finding: "A v3.10 regression, caught before release: once CurrencyAmounts stopped rounding every amount to a cent (and prices and quantities stopped being quantized), the multi-strategy book and valuation identities -- which hashed each Decimal's text -- gave two books that compare equal ('250000' vs '250000.00' of unassigned capital; a position of 100 at 10 vs 100.0 at 10.00) two identities. v3.9 gave them one."
    evidence: "golden example comparison (example 58); probe; tests/regression/test_identity_is_by_value.py fails with the pre-fix rendering"
    severity: "medium"
    current_state: "Fixed in v3.10.0: amounts enter both identities through alphalab.common.arithmetic.canonical_text (one text per number, never rounded); schemes alphalab.multi_strategy_book.v2 and alphalab.book_valuation.v2. The reconciliation identities (BRK-001) use the same function."
    required_change: "Render every amount in an identity by value."
    rationale: "An identity derived from content must not distinguish equal content."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_identity_is_by_value.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "addition"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "found in the v3.10 example review; a v3.10 regression, so the pin passes against v3.9.0 and fails against the pre-fix tree"
  - id: "DET-006"
    category: "determinism"
    subsystem: "cross-cutting"
    module: "alphalab/{portfolio_optimizer,analytics,allocation,execution,research}/*: rendering()/_render"
    finding: "Most content identities render a caller-declared Decimal with str() or repr(), so one declaration written '0.5' and '0.50' (a weight, a limit, a rate) gets two identities. Deterministic for identical inputs and unchanged since v3.9 -- these values were never rounded -- but not identity by value."
    evidence: "review of every digest renderer while fixing DET-005"
    severity: "low"
    current_state: "Unchanged in v3.10.0; the portfolio book, valuation and reconciliation identities render by value."
    required_change: "Render every Decimal in every content identity with canonical_text, bumping each scheme once, in one release."
    rationale: "One rule for identities; a scheme bump per identity is a migration a caller should see once."
    release: "v3.11.0"
    implementation_status: "not_started"
