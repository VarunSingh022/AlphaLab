  - id: "FEA-003"
    category: "missing_capability"
    subsystem: "proposal"
    module: "(new)"
    finding: "Walk-forward optimization harness"
    evidence: "Gap: Splits and sweeps exist separately; nothing composes them with fold-level evidence."
    severity: "medium"
    current_state: "Splits and sweeps exist separately; nothing composes them with fold-level evidence."
    required_change: "walk_forward_optimize(study, space, objective, splits, seed) returning per-fold selections, OOS metrics and a study result with identity."
    rationale: "Why: Selecting parameters in-sample and measuring out-of-sample per fold is the standard defence against overfitting. | User: Researchers. | Why AlphaLab owns it: Composes research splits, sweeps and study identities. | Why not iluvtrade: Research methodology. | Risk if omitted: Users compose it by hand and leak parameters across folds. | Tests: No fold's selection reads its test window (brute-force check). | Performance: O(folds x candidates) evaluations."
    release: "v3.11.0"
    implementation_status: "implemented (v3.11.0)"
    test_status: "tests/unit/research/test_walk_forward_optimization.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.11.0; ADR-0046"
    api_impact: "additive"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "IMPLEMENT"
    classification: "STRONGLY RECOMMENDED BEFORE V4"
    verified: "gap analysis"
    v311_outcome: "REPLACE WITH BETTER DESIGN of the proposed signature: research.walk_forward_optimize(study, design, objective, splits, *, produced_at). The seed is the study's (one source); the design -- ParameterSpace and Refit, no default -- is named as the study's 'walk_forward' input; selection on validation, report on test, the objective never handed a test instant while selecting (brute-force test)."

  - id: "FEA-004"
    category: "missing_capability"
    subsystem: "proposal"
    module: "(new)"
    finding: "Trade-print ingestion from flat files"
    evidence: "Gap: RecordType has BAR and QUOTE only."
    severity: "medium"
    current_state: "RecordType has BAR and QUOTE only."
    required_change: "RecordType.TRADE with a required declared schema (price, size, instant, optional trade id/aggressor); the ambiguity is resolved by declaration, never inference."
    rationale: "Why: Execution research (TCA, VWAP benchmarks, participation) needs prints; ROADMAP refuses flat-file trades because a price/size pair is ambiguous without a declaration. | User: Execution researchers. | Why AlphaLab owns it: Data canonicalization is AlphaLab's. | Why not iluvtrade: No vendor logic; declared schema. | Risk if omitted: Users hand-build ticks outside provenance. | Tests: Refusal when undeclared; provenance round trip. | Performance: Linear ingestion."
    release: "v3.12.0"
    implementation_status: "implemented (v3.12.0)"
    test_status: "tests/integration/test_trade_prints.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.12.0; ADR-0047"
    api_impact: "additive"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: false
    v4_disposition: "IMPLEMENT"
    classification: "STRONGLY RECOMMENDED BEFORE V4"
    verified: "gap analysis"
    v312_outcome: "data.TradeColumns and declare_trade_schema: a print is read only from the columns the caller names (trades are never detected from a header); deduplicated by the venue's trade identifier, a print with none never a duplicate (identical unidentified prints reported, both kept); aggressor side from declared codes (TradeAggressor). Trade.trade_id and aggressor; Tick.aggressor (pipeline 6); normalize_wire_trade carries both. A dataset's key gains an aggressor_codes section only when codes are declared, so no existing dataset version changes."

