# AlphaLab pre-v4 completion ledger.
# Generated from the audit's structured findings; one entry per actionable finding.

ledger:
  baseline_version: "3.9.0"
  baseline_commit: "c616978a9eeab39479c54cd3ff60e9331658a8aa"
  audit_date: "2026-09-27"
  status: "audit complete; v3.10.0 released (commit c93e9177146a6f6731bfa7068a5d8368656c8434); v3.11.0 released (commit a8a17b1f); v3.12.0 released (commit d3890781); v3.13.0 released (the commit tagged v3.13.0; every item assigned to it closed, the four assigned to v4.0.0 closed in it, every boundary and limitation reviewed with its reason, every limitation and deferral the release ADRs state classified, twenty-three findings added); nothing is assigned to a later release; v4.0.0 not started"
findings:
  - id: "KD-001"
    category: "known_defect"
    subsystem: "risk"
    module: "alphalab/risk/checks.py:check_position_limit"
    finding: "Pre-trade position limit adds an asset's notional exposure (market value) to an order quantity (units) and compares the sum with PositionLimit.max_quantity."
    evidence: "Code review; ROADMAP.md 'Known defects'; nowandfuture.md s20. PositionLimit.max_notional is additionally read by no check."
    severity: "high"
    current_state: "Unit-mismatched comparison; max_notional ignored; every certification RISK_LIMITS verdict carries the caveat."
    required_change: "Evaluate the projected post-trade position in quantity against max_quantity and in value against max_notional, reading the current signed quantity from the portfolio (the position authority) at evaluation time rather than from risk state."
    rationale: "A pre-trade limit that compares different units refuses orders the position does not warrant and permits ones it should refuse."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_risk_projection.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "additive"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "code review + ROADMAP self-report"
    v310_outcome: "Projected quantity against max_quantity and projected value against max_notional; the portfolio is the position authority."
  - id: "KD-002"
    category: "known_defect"
    subsystem: "risk"
    module: "alphalab/risk/checks.py:check_daily_loss; alphalab/runtime/execution_pipeline.py:_sync_risk_from_portfolio"
    finding: "DailyLossLimit is never enforced: RiskState.daily_loss is never maintained on the execution path, so the check always reads zero."
    evidence: "Code review: nothing assigns RiskState.daily_loss; ROADMAP.md 'Known defects'."
    severity: "high"
    current_state: "Configured daily-loss limits are silently inert."
    required_change: "Maintain daily loss from the portfolio equity history against a declared trading-day boundary (IANA zone), with no invented default zone; refuse a finite limit whose day is undeclared."
    rationale: "A risk limit that exists in configuration and does nothing is worse than no limit: it is believed."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_risk_projection.py; tests/regression/test_schema_upgrades.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "breaking"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "code review"
    v310_outcome: "DailyLossLimit(max_daily_loss, zone, day_start): IANA zone required, no default; loss maintained from NAV since the day began. A v3.9 payload's daily loss limit (no zone, never enforced) is dropped on upgrade with SchemaUpgradeWarning."
  - id: "KD-003"
    category: "known_defect"
    subsystem: "risk"
    module: "alphalab/risk/limits.py:ExposureLimit.max_net_exposure"
    finding: "ExposureLimit.max_net_exposure is read by no pre-trade check and its sign convention is defined nowhere."
    evidence: "grep: no reader; ROADMAP.md 'Known defects'."
    severity: "high"
    current_state: "Net exposure limit silently inert."
    required_change: "Define net exposure = long market value + short market value (short negative) in the base currency; check |projected net| <= max_net_exposure on the projected post-trade book."
    rationale: "Inert limit."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_risk_projection.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "code review"
    v310_outcome: "check_net_exposure: |long value + short value| of the projected book, shorts negative."
  - id: "KD-004"
    category: "known_defect"
    subsystem: "data"
    module: "alphalab/api.py:ingest_rows; alphalab/data/ingestion.py"
    finding: "A dataset ingested from in-memory rows is identified by whatever RawSource the caller hands over; rows recorded with an empty payload share one dataset version whatever they contain."
    evidence: "derive_dataset_version keys on request.source.content_hash only; ROADMAP.md 'Known defects'."
    severity: "medium"
    current_state: "Two different row sets can carry one dataset_version."
    required_change: "Derive the identity of row-ingested datasets from the canonical rendering of the rows themselves (records digest) in addition to the declared source, so different content can never share a version."
    rationale: "Dataset identity is the root of every research identity and reproducibility manifest."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_row_ingested_identity.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "code review"
    v310_outcome: "rows_content_hash (ROWS_CONTENT_SCHEME alphalab.rows.v1) enters the dataset identity via ingest_table(content_hash=...). Deviation: the reproducibility manifest still refuses empty-payload datasets (reason reworded)."
  - id: "RSK-001"
    category: "correctness"
    subsystem: "risk"
    module: "alphalab/risk/checks.py:check_buying_power"
    finding: "Buying power is checked against the full notional of every order regardless of side: a fully invested account cannot sell to reduce a position."
    evidence: "probes/p1_risk_sell.py: buy 990 @100 with 100k cash, then SELL 500 -> no order (rejected). Verified."
    severity: "critical"
    current_state: "Liquidation and de-risking impossible once cash is committed."
    required_change: "Charge buying power only for the part of an order that increases exposure (buying beyond covering a short, or selling short beyond the long); a reducing trade consumes none."
    rationale: "The canonical path could not exit positions; every result of a fully invested strategy is wrong."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_risk_projection.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "empirical probe"
    v310_outcome: "Buying power charged only for the increasing part (RiskProjection.increasing_notional). Reversal semantics decided here: a reversal is charged for its new opposite leg only."
  - id: "RSK-002"
    category: "correctness"
    subsystem: "risk"
    module: "alphalab/risk/checks.py:check_exposure/check_leverage/check_margin"
    finding: "Gross exposure, leverage and margin checks add the order notional regardless of side and current position, so risk-reducing trades are refused at a limit."
    evidence: "probes/p1_risk_sell.py: at the gross limit a SELL 50 of a 99 long is rejected. Verified."
    severity: "critical"
    current_state: "A book at or above a limit cannot be brought back inside it."
    required_change: "Project the post-trade book (current signed position plus the signed order) and check the projected gross/net/leverage/margin; a trade whose projection is no worse than the current state on the limited measure is not refused by that limit."
    rationale: "Risk checks must never block de-risking."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_risk_projection.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "empirical probe"
    v310_outcome: "Gross/net/leverage/margin refuse only a trade that worsens the limited measure."
  - id: "RSK-003"
    category: "correctness"
    subsystem: "risk"
    module: "alphalab/risk/checks.py:check_drawdown/check_daily_loss"
    finding: "A breached drawdown (or daily-loss) limit refuses every order, including liquidation."
    evidence: "probes/p1_risk_sell.py: in drawdown breach a full liquidation SELL is rejected. Verified."
    severity: "high"
    current_state: "Kill switch traps the book in its losing position."
    required_change: "In breach, refuse only orders that increase absolute exposure (reduce-only semantics), and report the breach on every decision."
    rationale: "Standard kill-switch semantics are reduce-only."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_risk_projection.py"
    benchmark_status: "n/a"
    documentation_status: "CHANGELOG 3.10.0; ADR-0045"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "FIX"
    verified: "empirical probe"
    v310_outcome: "Reduce-only in breach; breach reported on every decision (drawdown_breach, daily_loss_breach). Reversal semantics decided here: a reversal is not a reduction during a breach."
