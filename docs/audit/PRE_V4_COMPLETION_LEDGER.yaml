  - id: "PRF-007"
    category: "performance"
    subsystem: "common"
    module: "alphalab/common/append_log.py:AppendOnlyLog.__getitem__; alphalab/runtime/execution_pipeline.py"
    finding: "A slice of an AppendOnlyLog copied the whole view before slicing it. The execution pipeline slices the execution history (history[before:]) and the portfolio's events (events[before:]) on every fill, and the trade records per step, so each fill cost the length of the run so far and a run was quadratic in its length."
    evidence: "Found profiling the v3.11 release benchmarks. With the garbage collector paused, the pipeline benchmark's cost per event was 754, 952 and 1,136 microseconds at 2k, 8k and 16k events; with the fix 664, 678 and 651 (16k events: 18.2 s -> 10.4 s). The benchmarks' comments attributed everything above linear to the collector."
    severity: "high"
    current_state: "Shipped since v2.1.0, when AppendOnlyLog replaced tuple histories."
    required_change: "Copy only the requested entries: bound the slice by the view's length and slice the buffer directly."
    rationale: "A long backtest must cost in proportion to its length; the universe-size guard (TST-006) never measured run length."
    release: "v3.11.0"
    implementation_status: "implemented (v3.11.0)"
    test_status: "tests/regression/test_log_slicing_complexity.py"
    benchmark_status: "benchmarks/benchmark_execution_pipeline.py and benchmark_backtesting.py comments corrected; GC-off scaling measured"
    documentation_status: "CHANGELOG 3.11.0"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "improves"
    v4_required: true
    v4_disposition: "FIX"
    verified: "profile + GC-off scaling probe; the two allocation tests fail without the fix"
    v311_outcome: "Slice via slice.indices and a direct list slice (islice is not a fix: it walks to its start); semantics pinned against tuple slicing, older views included; allocation of a tail slice of a 200,000-entry log bounded by tracemalloc."
  - id: "PRF-008"
    category: "performance"
    subsystem: "common"
    module: "alphalab/common/persistent_map.py"
    finding: "A persistent map's chain held a (version, value) pair per write, and a rebase (PRF-002, v3.10) copied every live key into a new list and a new pair. A rebase of a large map promoted that copy into the collector's oldest generation at once and triggered full collections: the OMS benchmark's accept-and-fill stage spent 2.7 s of 5.6 s in the cyclic collector (1,592 / 145 / 3 collections of generations 0 / 1 / 2, against v3.9's 594 / 54 / 1), while with the collector paused it was within 5% of v3.9 (2.56 s against 2.43 s)."
    evidence: "Found when the v3.11 release measurement put the OMS benchmark at 1.12x v3.9 (median of five interleaved rounds), over the 1.1x budget PRF-006 states; measured with gc.callbacks."
    severity: "medium"
    current_state: "Shipped in v3.10.0, with compaction."
    required_change: "Keep a chain as one flat list, [version, value, version, value, ...]: a write appends in place and a rebase allocates one list per live key."
    rationale: "What a container leaves behind is walked by the collector for as long as it lives; a benchmark budget that holds only with the collector paused is not a budget a run meets."
    release: "v3.11.0"
    implementation_status: "implemented (v3.11.0)"
    test_status: "tests/regression/test_persistent_map_gc_pressure.py"
    benchmark_status: "benchmarks/benchmark_oms.py: accept-and-fill stage 5.6 s -> 3.9 s (v3.9 3.4 s); collections 813 / 74 / 2"
    documentation_status: "CHANGELOG 3.11.0; module docstring"
    api_impact: "none"
    architecture_impact: "local"
    performance_impact: "improves"
    v4_required: true
    v4_disposition: "FIX"
    verified: "gc.callbacks timing; allocation counts; the two allocation tests fail on the pair layout"
    v311_outcome: "Flat chains. The first cut read values through cast(V | _Missing, ...), which builds a typing union on every read and cost 20% with the collector paused; annotated locals replaced it, and the paused workload is now as fast as or faster than with pairs."
