    module: "alphalab/market/bar.py:Bar.timestamp; data ingestion; market/normalization.py"
    finding: "The canonical bar's timestamp has no defined meaning (interval start or end). The engine treats a bar as knowable and tradable at its timestamp, so start-stamped vendor bars leak the close into the bar's opening instant (look-ahead)."
