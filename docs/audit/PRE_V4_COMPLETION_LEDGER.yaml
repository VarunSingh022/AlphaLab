  - id: "DAT-001"
    category: "research_integrity"
    subsystem: "market/data"
    module: "alphalab/market/bar.py:Bar.timestamp; data ingestion; market/normalization.py"
    finding: "The canonical bar's timestamp has no defined meaning (interval start or end). The engine treats a bar as knowable and tradable at its timestamp, so start-stamped vendor bars leak the close into the bar's opening instant (look-ahead)."
    evidence: "Code review: no convention anywhere; BarClosed dispatched at bar.timestamp."
    severity: "high"
    current_state: "Look-ahead depends on the vendor's stamping convention, which nothing records."
    required_change: "Canonical convention: a bar is stamped at the end of its interval (the instant it is knowable). Ingestion and normalization require the source's convention (START or END) and shift START-stamped bars by the declared interval; refuse when undeclared."
    rationale: "Point-in-time correctness of the most common data type."
    release: "v3.10.0"
    implementation_status: "implemented (v3.10.0)"
    test_status: "tests/regression/test_bar_stamp_convention.py"
    benchmark_status: "n/a"
