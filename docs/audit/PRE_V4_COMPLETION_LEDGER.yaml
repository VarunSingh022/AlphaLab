    v313_outcome: "ExpiryInterpolation.TOTAL_VARIANCE_LINEAR and implied_vol_across_expiries(surface, strike, expiry, method=): at a fixed strike, read at each bracketing expiry and interpolated linearly in total variance. Interpolation is done only by name; an expiry outside the quoted range is refused rather than extrapolated, and total variance that falls with expiry is refused as a calendar arbitrage rather than smoothed."
  - id: "FEA-006"
    category: "missing_capability"
    subsystem: "proposal"
    module: "(new)"
    finding: "Engine-parity certification report for a release"
    evidence: "Gap: Evidence scattered across tests."
    severity: "low"
    current_state: "Evidence scattered across tests."
    required_change: "Generate docs/audit/V4_RELEASE_CERTIFICATION.md evidence from a certification script run in CI."
