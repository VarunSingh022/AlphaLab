    category: "numerical"
    subsystem: "portfolio"
    module: "alphalab/portfolio/money.py:SHARE_QUANT/to_quantity"
    finding: "Fill quantities are quantized to 1e-6; a real venue fill of 0.0000005 BTC raises InvalidTransactionError and cannot be booked; other quantities are silently rounded away from the venue's."
