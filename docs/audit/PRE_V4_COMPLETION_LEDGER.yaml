  - id: "PRF-009"
    category: "performance"
    subsystem: "runtime/portfolio"
    module: "alphalab/runtime/execution_pipeline.py:_bucket_exposures; alphalab/portfolio/book.py"
    finding: "Every order judged against a classification limit summed its bucket's members: a rebalance of N names under sector limits cost N^2 over the number of sectors. At 10,000 assets the per-record cost was 3.34x that at 400 (1,225 against 366 us), where the same run without limits grew 1.23x."
    evidence: "The v3.12 stress run (docs/audit/scripts/stress_v3_12.py assets)."
    severity: "medium"
    current_state: "Introduced with OFE-001 during v3.12; never shipped."
    required_change: "Keep each limited bucket's gross with the book, exactly, on every change; read it and add what working orders commit; sum the members only where the two could differ."
    rationale: "A risk check's cost must follow the order, not the book."
    release: "v3.12.0"
    implementation_status: "implemented (v3.12.0)"
    test_status: "tests/integration/test_bucket_gross_kept_by_the_book.py; tests/unit/portfolio/test_book_groups.py; tests/regression/test_sector_classification_reaches_attribution.py"
    benchmark_status: "stress: 381 -> 498 us a record from 400 to 10,000 assets (1.31x)"
    documentation_status: "CHANGELOG 3.12.0; ADR-0047"
    api_impact: "additive"
    architecture_impact: "local"
    performance_impact: "improves"
    v4_required: true
    v4_disposition: "FIX"
    verified: "stress re-run; every order of randomized runs judged both ways (equal as numbers and as written); mutations X41-X44 caught"
    v312_outcome: "PositionBook.grouped(BookGroups) keeps an exact (count, gross) per (dimension, label, currency), dropped with a group's last position; BookMarketValues.group_gross; the pipeline installs the grouping at initialize and restore for the dimensions its limits bound and reads it when the book is in the base currency and the registry is the one grouped by. The grouping is not part of the book's value."
  - id: "PRF-010"
    category: "performance"
    subsystem: "strategy"
    module: "alphalab/strategy/engine.py:process_event; alphalab/runtime/execution_pipeline.py:wants_slices, wants_observation, _wants_feedback"
    finding: "Every event asked every registered strategy whether it subscribed: each strategy cost about 0.34 us on every record whatever its subscriptions. Ten strategies trading one asset took 665 us a record alone, 1,012 beside 1,000 strategies trading other assets and 4,097 beside 10,000."
    evidence: "The v3.12 stress run's 1,000-strategy scenario, then a probe holding the reached strategies fixed and varying the others."
    severity: "medium"
    current_state: "Shipped since v3.11 (EXE-007 routed on subscriptions by asking each strategy)."
    required_change: "Route from an index of the subscriptions, in registration order, kept with the runtime state."
    rationale: "An event should cost the strategies it reaches."
    release: "v3.12.0"
    implementation_status: "implemented (v3.12.0)"
    test_status: "tests/unit/strategy/test_routing_index.py; tests/regression/test_strategy_routing_complexity.py"
    benchmark_status: "probe: 667 / 629 / 661 us a record beside 0 / 1,000 / 10,000 other strategies; stress: 1,000 strategies on their own assets 1.1 ms a record against 6.8 ms on every bar"
    documentation_status: "CHANGELOG 3.12.0; ADR-0047"
    api_impact: "additive"
    architecture_impact: "local"
    performance_impact: "improves"
    v4_required: true
    v4_disposition: "FIX"
    verified: "equivalence against the per-strategy question for every topic and asset; both guards fail on the old scan; mutations X45-X47"
    v312_outcome: "strategy.subscription.RoutingIndex (everything / topic / topic-and-asset positions, merged in registration order); RuntimeState.reach builds it once per state and RuntimeState.evolved hands it on across the changes the runtime makes (a start, a failure, a stop), rebuilding when a strategy's subscriptions change; a copy or a pickle of the state carries no index and rebuilds it on first read. Dispatch order is unchanged."
