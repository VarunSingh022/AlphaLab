  - id: "FEA-001"
    category: "missing_capability"
    subsystem: "proposal"
    module: "(new)"
    finding: "Target-position and target-weight intents with a deterministic rebalancer"
    evidence: "Gap: Intent is a delta; construction ends at weights ('the caller's decision')."
    severity: "high"
    current_state: "Intent is a delta; construction ends at weights ('the caller's decision')."
    required_change: "IntentKind {DELTA, TARGET_QUANTITY, TARGET_WEIGHT}; allocation computes delta = target - position - working, rounds to the instrument's lot (conventions.lot) and min notional, refuses rather than scales."
    rationale: "Why: Portfolio strategies state targets, not deltas; turning construction weights into orders is the step every user rewrites. | User: Researchers running cross-sectional and optimizer-driven strategies. | Why AlphaLab owns it: It needs positions, working orders, prices, lot sizes and budgets - all engine state. | Why not iluvtrade: No application concern; pure computation over engine state. | Risk if omitted: Accumulation bugs; every user writes a subtly different rebalancer. | Tests: Property tests: rebalancing to the current book emits nothing; weights sum; lot refusals named. | Performance: O(intents) per event."
    release: "v3.11.0"
    implementation_status: "not_started"
    test_status: "planned"
    benchmark_status: "n/a"
    documentation_status: "planned"
    api_impact: "additive"
    architecture_impact: "local"
    performance_impact: "neutral"
    v4_required: true
    v4_disposition: "IMPLEMENT"
    classification: "REQUIRED FOR V4"
    verified: "gap analysis"
