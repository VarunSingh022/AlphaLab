name: Benchmarks

# Every benchmark, run in full, weekly and on demand (ledger TST-003). Too slow
# for every push -- about nine minutes -- and a benchmark that is never run is
# how `benchmarks_market_engine.py` went unnoticed as unable to run at all.
# A benchmark that raises, or warns, fails the job; timings are printed, not
# gated, because shared runners are too noisy to gate on. The complexity guards
# in tests/regression gate scaling on every push instead.
#
# Run on every supported interpreter (v4.1, ledger LIM-007). The job installs
# the development extra because a benchmark may share a helper with the tests;
# tests/regression/test_workflow_environments.py holds every benchmark's
# imports to what this job installs, so a job that installs too little fails
# in the suite rather than on its first hosted run, as v4.0.0's did.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # Release preflight (.github/workflows/preflight.yml) runs every benchmark
  # against one exact candidate commit before a release is published.
  workflow_call:
    inputs:
      ref:
        description: "The commit to check out and run; empty means the triggering event's own"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run every benchmark
        run: |
          set -euo pipefail
          for benchmark in benchmarks/benchmark_*.py; do
            echo "::group::${benchmark}"
            timeout 900 python -W error "${benchmark}"
            echo "::endgroup::"
          done
