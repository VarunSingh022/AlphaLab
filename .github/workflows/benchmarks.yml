name: Benchmarks

# Every benchmark, run in full, weekly and on demand (ledger TST-003). Too slow
# for every push -- about nine minutes -- and a benchmark that is never run is
# how `benchmarks_market_engine.py` went unnoticed as unable to run at all.
# A benchmark that raises, or warns, fails the job; timings are printed, not
# gated, because shared runners are too noisy to gate on. The complexity guards
# in tests/regression gate scaling on every push instead.
#
# Run on every supported interpreter (v4.1, ledger LIM-007), on Linux and macOS
# (v4.3 M6, TD-33, TD-35, TD-39). Linux runs every benchmark, as it always has, and
# is authoritative: PC-07's limits are judged there (the owner's decision,
# 2026-11-16). macOS runs the capture benchmark as a diagnostic: its figures are
# printed, an unreliable one reported as such, and none fails the job. Hosted
# macOS runners read timings as their own noise: an order book's scaling at
# 1.85x on one cell and 3.07x on the next, a capture cheaper than none. Every benchmark runs even after one fails, so a failure
# hides nothing measured after it; the job then fails. Each is bounded by Python
# itself, since macOS has no GNU `timeout`. The job installs
# the development extra because a benchmark may share a helper with the tests;
# tests/regression/test_workflow_environments.py holds every benchmark's
# imports to what this job installs, so a job that installs too little fails
# in the suite rather than on its first hosted run, as v4.0.0's did.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  # Release preflight (.github/workflows/preflight.yml) runs every benchmark
  # against one exact candidate commit before a release is published.
  workflow_call:
    inputs:
      ref:
        description: "The commit to check out and run; empty means the triggering event's own"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.os }}, Python ${{ matrix.python-version }}, ${{ matrix.role }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
        include:
          - os: ubuntu-latest
            role: authoritative
          - os: macos-latest
            role: diagnostic

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run every benchmark
        env:
          ALPHALAB_BENCHMARK_ROLE: ${{ matrix.role }}
        run: |
          set -euo pipefail
          failed=()
          if [ "${RUNNER_OS}" = "macOS" ]; then
            benchmarks=(benchmarks/benchmark_capture.py)
          else
            benchmarks=(benchmarks/benchmark_*.py)
          fi
          for benchmark in "${benchmarks[@]}"; do
            echo "::group::${benchmark}"
            if ! python -c 'import subprocess, sys; sys.exit(subprocess.run([sys.executable, "-W", "error", sys.argv[1]], timeout=900).returncode)' "${benchmark}"; then
              failed+=("${benchmark}")
              echo "::error::${benchmark} failed"
            fi
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
