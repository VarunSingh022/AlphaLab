name: Release Preflight

# Every gate a release must pass, run against one exact candidate commit BEFORE
# the release is published. release.yml runs only on `release: published`, too
# late to stop a bad release; this runs the same release checks, and the CI,
# CodeQL and benchmark gates, while there is still nothing to take back.
#
# Which commit it validates, and how it refuses to validate the wrong one:
#   * A push to the v4.0.0 candidate branch, work/v4.0.0-qa-hardening: the
#     commit pushed, and only that -- the run's commit must be the pushed tip
#     (github.event.after), the ref must be that branch, and a deletion is
#     refused: when a branch is deleted GitHub reports the DEFAULT branch's
#     commit for the run, which is how a push trigger could validate `main`.
#     This route needs nothing on `main`. Retarget or remove it after v4.0.0.
#   * Run manually ("Run workflow"): the commit of the branch or tag chosen under
#     "Use workflow from". The `candidate` input must repeat that name, so a run
#     left on `main` by mistake fails in its first step instead of validating
#     `main`. GitHub only offers "Run workflow" once this file is on the default
#     branch.
#   * A pull request into `main` carrying the `release-preflight` label: the pull
#     request's head commit -- the candidate branch exactly, not the merge
#     commit GitHub would test -- on labelling and on every push after it.
#
# It publishes nothing. Its token is read-only (CodeQL's job also writes its own
# status), it creates no tag, release, commit or comment, and its one output is
# a run artifact: the distributions it built from the candidate, their SHA-256
# sums and the verification record (docs/audit/scripts/release_preflight.py).

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "The branch or tag selected under 'Use workflow from', typed again (guards against validating main by mistake)"
        required: true
        type: string
      expected_version:
        description: "The version this release will be, e.g. 4.0.0 (its tag is v<version>)"
        required: true
        type: string
  # The candidate branch alone; never main. The guard below names it again.
  push:
    branches:
      - work/v4.0.0-qa-hardening
  pull_request:
    branches:
      - main
    types:
      - labeled
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Candidate and release identity
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && !github.event.deleted)
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'release-preflight'))
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}

    steps:
      - name: Resolve the candidate commit
        id: resolve
        env:
          EVENT: ${{ github.event_name }}
          CANDIDATE: ${{ inputs.candidate }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
          # The branch on.push.branches names; a test holds the two together.
          PUSH_BRANCH: work/v4.0.0-qa-hardening
          PUSHED_SHA: ${{ github.event.after }}
          PUSH_DELETED: ${{ github.event.deleted }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          refuse() {
            echo "::error::$1 Nothing was validated."
            exit 1
          }
          case "${EVENT}" in
            workflow_dispatch)
              if [ "${CANDIDATE}" != "${REF_NAME}" ]; then
                refuse "The candidate input is '${CANDIDATE}', but this run is on '${REF_NAME}'. Choose the candidate under 'Use workflow from' and type the same name."
              fi
              sha="${RUN_SHA}"
              ref="${REF_NAME}"
              ;;
            push)
              if [ "${PUSH_DELETED}" = "true" ]; then
                refuse "This push deleted '${REF_NAME}'; GitHub reports the default branch's commit for it, which is not a candidate."
              fi
              if [ "${REF}" != "refs/heads/${PUSH_BRANCH}" ]; then
                refuse "This push updated '${REF}', not the candidate branch 'refs/heads/${PUSH_BRANCH}'."
              fi
              if ! [[ "${PUSHED_SHA}" =~ ^[0-9a-f]{40}$ ]] || [ "${PUSHED_SHA}" = "0000000000000000000000000000000000000000" ]; then
                refuse "The pushed commit '${PUSHED_SHA}' is not a commit."
              fi
              if [ "${RUN_SHA}" != "${PUSHED_SHA}" ]; then
                refuse "The run's commit ${RUN_SHA} is not the commit pushed, ${PUSHED_SHA}."
              fi
              sha="${PUSHED_SHA}"
              ref="${REF_NAME}"
              ;;
            pull_request)
              if ! [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
                refuse "The pull request's head commit '${HEAD_SHA}' is not a commit."
              fi
              sha="${HEAD_SHA}"
              ref="${HEAD_REF}"
              ;;
            *)
              refuse "Release Preflight does not run on '${EVENT}'."
              ;;
          esac
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "### Release preflight: \`${ref}\` at \`${sha}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Check out the candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The candidate must BE the release, not merely agree with itself: a tree
      # whose every reference says 4.0.1 fails here. A manual run names the
      # release in expected_version; a push or a labelled pull request is the
      # candidate branch's release, RELEASE_VERSION (a test holds it to the
      # package's version and to the push branch's name).
      - name: Release identity
        id: identity
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED_VERSION: ${{ inputs.expected_version }}
          RELEASE_VERSION: "4.0.0"
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            expected="${DISPATCHED_VERSION}"
          else
            expected="${RELEASE_VERSION}"
          fi
          python docs/audit/scripts/release_preflight.py version --expected "${expected}"
          echo "version=${expected}" >> "${GITHUB_OUTPUT}"
          echo "Version \`${expected}\`: the package declares it; the CHANGELOG, the release certificate and the API manifest are its." >> "${GITHUB_STEP_SUMMARY}"

  quality:
    name: CI gates
    needs: candidate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.candidate.outputs.sha }}

  benchmarks:
    name: Benchmarks
    needs: candidate
    uses: ./.github/workflows/benchmarks.yml
    with:
      ref: ${{ needs.candidate.outputs.sha }}

  codeql:
    name: CodeQL gate
    needs: candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # CodeQL reports its own status with this; with `upload: never` no
      # analysis is sent to code scanning.
      security-events: write

    steps:
      - name: Check out the candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: ${{ runner.temp }}/codeql

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Fails on an error-level result or a high or critical security severity,
      # and lists every result either way.
      - name: Gate on the findings
        run: python docs/audit/scripts/release_preflight.py codeql "${RUNNER_TEMP}/codeql"

  distributions:
    name: Distributions
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build the sdist and the wheel
        run: python -m build --outdir "${RUNNER_TEMP}/dist" .

      - name: Validate the metadata strictly
        run: python -m twine check --strict "${RUNNER_TEMP}"/dist/*

      - name: Check, hash, install and smoke-test each artifact
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        run: |
          set -euo pipefail
          python docs/audit/scripts/release_preflight.py distributions "${RUNNER_TEMP}/dist" \
            --version "${VERSION}" --record "${RUNNER_TEMP}/dist/VERIFICATION-${VERSION}.txt"
          {
            echo '```'
            cat "${RUNNER_TEMP}/dist/VERIFICATION-${VERSION}.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Keep the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alphalab-${{ needs.candidate.outputs.version }}-${{ needs.candidate.outputs.sha }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 30

  verdict:
    name: Release preflight verdict
    needs: [candidate, quality, benchmarks, codeql, distributions]
    if: always() && needs.candidate.result != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          {
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "${RESULTS}" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "${GITHUB_STEP_SUMMARY}"
          failed="$(echo "${RESULTS}" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          if [ -n "${failed}" ]; then
            echo "::error::Release preflight failed: ${failed}. Do not publish."
            exit 1
          fi
          echo "Every release gate passed on this commit." >> "${GITHUB_STEP_SUMMARY}"
