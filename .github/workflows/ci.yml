name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Release preflight (.github/workflows/preflight.yml) runs these same gates
  # against one exact candidate commit before a release is published.
  workflow_call:
    inputs:
      ref:
        description: "The commit to check out and check; empty means the triggering event's own"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  quality:
    # Every supported interpreter on both supported operating systems (v4.1,
    # ledger LIM-007): CPython 3.12, 3.13 and 3.14, on Linux and macOS. Each
    # cell is a required gate: no cell may fail, and none is allowed to.
    # fail-fast is off so that one failing cell does not hide the others.
    name: Quality Gates (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (Lint)
        run: python -m ruff check .

      - name: Ruff (Format Check)
        run: python -m ruff format --check .

      - name: MyPy
        run: python -m mypy .

      # Warnings are errors: a ResourceWarning (an unclosed socket or file) or
      # a DeprecationWarning fails the run instead of scrolling past (TST-003).
      - name: Pytest
        run: python -m pytest -W error

      - name: Examples
        run: |
          set -euo pipefail
          for example in examples/[0-9]*.py; do
            echo "::group::${example}"
            python -W error "${example}"
            echo "::endgroup::"
          done

      # One statement of what this build was checked to do -- determinism,
      # parity, reproducibility, numerical references, the public API -- held
      # to the committed certificate (ledger FEA-006). A change in what the
      # engine computes fails here until it is re-certified and reviewed, and
      # so does a change to the engine's source: the certificate names the
      # source it certified (ledger REP-004). Run on every interpreter and
      # both systems, so a figure that moves with the host is found (LIM-005).
      - name: Release certification
        run: python -W error docs/audit/scripts/certify_release.py --check

      - name: Build package
        run: python -m build

      # --strict: a warning in the metadata a release would publish is an error.
      - name: Validate distributions
        run: python -m twine check --strict dist/*

      # The suite runs against the source tree; this runs against what would be
      # published, with the command release.yml runs on a published tag --
      # including its relative `dist`, the form that failed v4.0.0's post-release
      # validation (v4.1). Each artifact goes alone into a fresh environment and
      # tests/installed_smoke.py checks it from outside the checkout.
      - name: Verify the distributions as release validation does
        run: |
          set -euo pipefail
          version="$(python docs/audit/scripts/release_preflight.py package-version)"
          python docs/audit/scripts/release_preflight.py distributions dist \
            --version "${version}" --record "dist/VERIFICATION-${version}.txt"
          cat "dist/VERIFICATION-${version}.txt"
