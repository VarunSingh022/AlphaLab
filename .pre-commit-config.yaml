default_language_version:
  python: python3.12

# The hook revisions are the tool versions pyproject.toml's dev extra resolves
# to, so a commit is checked by the same ruff and mypy that CI runs (ledger
# TST-004). tests/regression/test_release_gates_are_wired.py holds them to it.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        pass_filenames: false
        # What CI runs: the whole tree, examples and benchmarks included. The
        # tests import pytest, so the hook's isolated environment needs it too.
        args: ["."]
        additional_dependencies:
          - "pytest>=8.4,<10"
